  <g filter="url(#pieceShadowDark)">
    <circle cx="50" cy="50" r="42" fill="url(#coreDark)"/>
    <circle cx="50" cy="50" r="42" fill="none" stroke="url(#rimDark)" stroke-width="4"/>
    <circle cx="50" cy="50" r="26" fill="none" stroke="#8ef9ff" stroke-opacity="0.22" stroke-width="2"/>
    <circle cx="50" cy="50" r="18" fill="none" stroke="#ff98e2" stroke-opacity="0.18" stroke-width="2"/>
    <ellipse cx="39" cy="34" rx="17" ry="12" fill="url(#shineDark)"/>
    <ellipse cx="57" cy="66" rx="20" ry="9" fill="#9db6ff" fill-opacity="0.1"/>
  </g>
