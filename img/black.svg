<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="50" height="50" viewBox="0 0 100 100" role="img" aria-label="Black Reversi piece">
  <defs>
    <radialGradient id="coreDark" cx="34%" cy="28%" r="74%">
      <stop offset="0%" stop-color="#2f3449"/>
      <stop offset="55%" stop-color="#111524"/>
      <stop offset="100%" stop-color="#03040a"/>
    </radialGradient>
    <linearGradient id="rimDark" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#86f8ff" stop-opacity="0.72"/>
      <stop offset="45%" stop-color="#c885ff" stop-opacity="0.48"/>
      <stop offset="100%" stop-color="#27304f" stop-opacity="0.88"/>
    </linearGradient>
    <radialGradient id="shineDark" cx="31%" cy="28%" r="38%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.72"/>
