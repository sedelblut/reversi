<svg height="500" width="500" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <pattern height="62.5" id="grid" patternUnits="userSpaceOnUse" width="62.5">
      <path d="M 62.5 0 L 0 0 0 62.5" fill="none" stroke-width="2.8" stroke="#ffffff" stroke-opacity="0.82"/>
    </pattern>
  </defs>

  <g filter="url(#softGlow)">
    <rect fill="url(#grid)" height="100%" width="100%"/>
    <line stroke-width="2.8" stroke="#ffffff" stroke-opacity="0.82" x1="0" x2="500" y1="500" y2="500"/>
    <line stroke-width="2.8" stroke="#ffffff" stroke-opacity="0.82" x1="500" x2="500" y1="0" y2="500"/>
  </g>
</svg>
