<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="50" height="50" viewBox="0 0 100 100" role="img" aria-label="White Reversi piece">
  <defs>
    <radialGradient id="coreLight" cx="36%" cy="28%" r="75%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="58%" stop-color="#ebf3ff"/>
      <stop offset="100%" stop-color="#b3bfd1"/>
    </radialGradient>
    <linearGradient id="rimLight" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#7aefff" stop-opacity="0.88"/>
      <stop offset="50%" stop-color="#ffb7ea" stop-opacity="0.64"/>
      <stop offset="100%" stop-color="#f5f9ff" stop-opacity="0.95"/>
    </linearGradient>
    <radialGradient id="shineLight" cx="30%" cy="26%" r="34%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <filter id="pieceShadowLight" x="-30%" y="-30%" width="160%" height="170%">
      <feDropShadow dx="0" dy="4" stdDeviation="3" flood-color="#000000" flood-opacity="0.45"/>
    </filter>
  </defs>

  <g filter="url(#pieceShadowLight)">
    <circle cx="50" cy="50" r="42" fill="url(#coreLight)"/>
    <circle cx="50" cy="50" r="42" fill="none" stroke="url(#rimLight)" stroke-width="4"/>
    <circle cx="50" cy="50" r="26" fill="none" stroke="#63ecff" stroke-opacity="0.24" stroke-width="2"/>
    <circle cx="50" cy="50" r="18" fill="none" stroke="#ff9bdc" stroke-opacity="0.2" stroke-width="2"/>
    <ellipse cx="38" cy="33" rx="18" ry="13" fill="url(#shineLight)"/>
    <ellipse cx="57" cy="67" rx="21" ry="9" fill="#89bfff" fill-opacity="0.12"/>
  </g>
</svg>
