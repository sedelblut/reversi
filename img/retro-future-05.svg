<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" role="img" aria-label="Retro future arcade plasma background">
  <defs>
    <linearGradient id="bg05" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#16001f"/>
      <stop offset="50%" stop-color="#36002c"/>
      <stop offset="100%" stop-color="#03294c"/>
    </linearGradient>
    <filter id="blur05" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="20"/>
    </filter>
    <linearGradient id="orb05" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#9aff70"/>
      <stop offset="100%" stop-color="#18d4ff"/>
    </linearGradient>
  </defs>

  <rect width="500" height="500" fill="url(#bg05)"/>

  <g filter="url(#blur05)">
    <circle cx="120" cy="130" r="86" fill="#ff4ca8" fill-opacity="0.7"/>
    <circle cx="310" cy="120" r="92" fill="#35efff" fill-opacity="0.65"/>
    <circle cx="392" cy="276" r="98" fill="#ffd23e" fill-opacity="0.6"/>
    <circle cx="180" cy="332" r="110" fill="#8e69ff" fill-opacity="0.66"/>
    <circle cx="290" cy="368" r="92" fill="#58ff96" fill-opacity="0.54"/>
  </g>

  <circle cx="250" cy="250" r="56" fill="url(#orb05)" fill-opacity="0.85"/>
  <circle cx="250" cy="250" r="24" fill="#ffffff" fill-opacity="0.55"/>
</svg>
